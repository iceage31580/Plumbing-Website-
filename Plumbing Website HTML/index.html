<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plumbing Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header styling */
        .header {
            background-color: #003399; /* Blue background */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .header .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header .company-name {
            font-size: 28px;
            text-align: center;
        }

        .header .contact {
            font-size: 18px;
            font-weight: bold;
        }

        /* Navigation bar styling */
        .navbar {
            background-color: #0044cc; /* Slightly lighter blue */
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .navbar a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }

        .navbar a:hover {
            background-color: #003399;
            color: white;
        }

        /* Hero image styling */
        .hero-image {
            width: 100%;
            height: 300px;
            background-image: url(C:https://i.pinimg.com/736x/ef/93/10/ef9310903b997034076ae561146e5492.jpg); /* Replace with your image URL */
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Header Section -->
    <div class="header">
        <div class="logo">JR Plumbing</div>
        <div class="company-name">JR Plumbing</div>
        <div class="contact">(818) 462-4978</div>
    </div>

    <!-- Hero Image Section -->
    <div class="hero-image"></div>
</body>
</html>
